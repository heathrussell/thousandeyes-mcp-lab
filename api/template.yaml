AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ThousandEyes MCP Lab scoreboard API (check-in, answers, hints, live leaderboard)

Parameters:
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: The site origin allowed to call the API, e.g. https://lab.example.com. Keep * only while testing.
  AnthropicApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional. Set it to enable the front desk (/ask) with Claude. Leave blank to keep the API answer-free.
  AnthropicModel:
    Type: String
    Default: claude-haiku-5-5
  AnswersB64:
    Type: String
    Default: ''
    NoEcho: true
    Description: base64 of api/answers.json (scripts/deploy.sh fills this in). Blank means every answer is marked wrong.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 25
    MemorySize: 256

Resources:
  Players:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  Fn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      CodeUri: .
      Environment:
        Variables:
          TABLE_NAME: !Ref Players
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          ANTHROPIC_MODEL: !Ref AnthropicModel
          ANSWERS_B64: !Ref AnswersB64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Players
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /
            Method: ANY

Outputs:
  ApiUrl:
    Description: Paste this into dist/config.js as apiBase (no trailing slash)
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Players
